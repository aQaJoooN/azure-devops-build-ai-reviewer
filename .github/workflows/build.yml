name: Build and Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - develop

env:
  EXTENSION_ID: azure-devops-ai-analyzer
  PUBLISHER_ID: aQaJoooN

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install tfx-cli
        run: npm install -g tfx-cli

      - name: Get version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            VERSION="1.0.${{ github.run_number }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
          echo "Building version: $VERSION"

      - name: Update version in manifests
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Update vss-extension.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" vss-extension.json

      - name: Create output directory
        run: mkdir -p ./output

      - name: Package extension
        run: |
          tfx extension create --manifest-globs vss-extension.json --output-path ./output
          echo "Extension packaged successfully"

      - name: List artifacts
        run: |
          echo "Generated VSIX files:"
          ls -lh output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: output/*.vsix
          retention-days: 300

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-package
          path: output

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## Version $VERSION" > release-notes.md
          echo "" >> release-notes.md
          echo "### Features" >> release-notes.md
          echo "- AI-powered build log analysis" >> release-notes.md
          echo "- Analyze and Super Analyze modes" >> release-notes.md
          echo "- Flexible AI backend configuration" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Installation" >> release-notes.md
          echo "1. Download the \`.vsix\` file below" >> release-notes.md
          echo "2. Upload to your Azure DevOps organization" >> release-notes.md
          echo "3. See [README.md](README.md) for configuration details" >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: output/*.vsix
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "🎉 Release v${{ steps.version.outputs.version }} created successfully!"
          echo "📦 VSIX package uploaded to GitHub Releases"